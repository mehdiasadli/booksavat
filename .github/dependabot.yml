version: 2

updates:
  # `bun`, not `npm`: the npm ecosystem edits package.json without touching
  # bun.lock, which fails `bun install --frozen-lockfile` on every PR.
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    labels: ["area:deps"]
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: scope
    groups:
      # One PR per ecosystem instead of thirty individual ones.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom", "next"]
      orpc:
        patterns: ["@orpc/*"]
      drizzle:
        patterns: ["drizzle-orm", "drizzle-kit", "pg", "@types/pg"]
      tooling:
        patterns:
          ["@biomejs/*", "lefthook", "typescript", "vitest", "@vitest/*", "@commitlint/*"]
      testing:
        patterns: ["@testing-library/*", "jsdom"]
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    labels: ["area:ci"]
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

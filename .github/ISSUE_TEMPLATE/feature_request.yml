name: Feature request
description: Propose something new or an improvement
labels: ["enhancement"]

body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is awkward, missing, or slow today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead. Rough is fine.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why this one is better.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Auth / sessions
        - Database / migrations
        - API (oRPC)
        - UI
        - Build / tooling
        - Not sure
    validations:
      required: true
